name: weather-news-telegram
on:
  schedule:
    - cron: "*/15 23 * * 0-4"  # 평일 KST 08:00~08:45 (UTC 전날 23시, 일~목) 15분 간격 (보조)
    - cron: "*/15 0-8 * * 1-5" # 평일 KST 09:00~17:45, 15분 간격 (보조)
    - cron: "0 9 * * 1-5"      # 평일만, UTC 09:00 = KST 18:00 (마지막 실행)
  workflow_dispatch:
    inputs:
      test:
        description: "true 이면 최신 기사 1건을 테스트로 전송(이력 변경 없음)"
        default: "false"
      since:
        description: "구간 테스트 시작 (KST, 예: 2026-11-02 00:00) - until 과 함께 입력"
        default: ""
      until:
        description: "구간 테스트 끝 (KST, 예: 2026-11-02 09:00)"
        default: ""
      mode:
        description: "collect 이면 전송 없이 기사만 수집(밤·주말용), 비우면 일반 전송"
        default: ""
      debug:
        description: "1 이면 RSS 원본 요약 형식을 로그에 출력(전송 없음)"
        default: ""
permissions:
  contents: write
concurrency: news
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기열에서 기다린 실행도 앞 실행이 저장한 최신 main 을 받도록 (오래된 커밋 기준 중복 전송 방지)
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python news_bot/notify.py ${{ inputs.test == 'true' && '--test' || '' }} ${{ github.event_name == 'schedule' && '--only-hours' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WIN_SINCE: ${{ inputs.since }}
          WIN_UNTIL: ${{ inputs.until }}
          DEBUG_FEED: ${{ inputs.debug }}
          MODE: ${{ inputs.mode }}
      - name: 전송 이력 저장
        run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add data.json
          [ -f news_bot/sent.json ] && git add news_bot/sent.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update sent"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -q && git push -q; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            if [ "$ok" != 1 ]; then echo "::error::전송 이력 저장(push) 실패 - 다음 실행에서 중복 전송될 수 있음"; exit 1; fi
          fi
