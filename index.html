<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부산·울산·경남 기상·재해 뉴스</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --line: #e1e0d9;
    --border: rgba(11,11,11,.10);
    --wash: rgba(11,11,11,.05);
    --accent: #2a78d6;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
      --line: #2c2c2a; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
      --accent: #3987e5; --critical: #ec6a6a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
    --line: #2c2c2a; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
    --accent: #3987e5; --critical: #ec6a6a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 48px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 6px 12px; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -.01em; }
  .upd { color: var(--ink-2); font-size: 13px; }
  .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
  .chip:hover { background: var(--wash); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .sp { flex: 1; }
  .ghost { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .ghost:hover { background: var(--wash); }

  h2.day { margin: 22px 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  ul.news { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  ul.news li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  ul.news li:last-child { border-bottom: 0; }
  ul.news li.imp { box-shadow: inset 3px 0 0 var(--critical); }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 600; word-break: keep-all; overflow-wrap: anywhere; }
  .meta { margin-top: 2px; font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 0 10px; align-items: center; }
  .flag { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; color: var(--ink); }
  .flag svg { width: 12px; height: 12px; }
  .flag path { fill: var(--critical); }
  a.go { flex: none; text-decoration: none; font-size: 14px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 5px 12px; white-space: nowrap; }
  a.go:hover { background: var(--accent); color: var(--surface); }
  .empty { text-align: center; color: var(--ink-2); padding: 36px 8px; }
  .more { text-align: center; margin-top: 16px; }
  .err { color: var(--critical); text-align: center; padding: 10px; }
  .busy { opacity: .6; transition: opacity .15s; }

  @media (max-width: 520px) {
    ul.news li { align-items: flex-start; flex-direction: column; gap: 8px; }
    a.go { align-self: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>부산·울산·경남 기상·재해 뉴스</h1>
    <span class="upd" id="upd" aria-live="polite">불러오는 중…</span>
  </header>

  <div class="tools" role="group" aria-label="지역 필터">
    <button class="chip" type="button" data-r="전체" aria-pressed="true">전체</button>
    <button class="chip" type="button" data-r="부산" aria-pressed="false">부산</button>
    <button class="chip" type="button" data-r="울산" aria-pressed="false">울산</button>
    <button class="chip" type="button" data-r="경남" aria-pressed="false">경남</button>
    <span class="sp"></span>
    <button class="ghost" type="button" id="theme" aria-label="화면 모드 변경">화면: 자동</button>
  </div>

  <div id="err" class="err" style="display:none"></div>
  <main id="list"></main>
  <div class="more" id="more"></div>
</div>

<script>
(function () {
  "use strict";
  const KST = 9 * 3600e3, DAY = 86400e3, PAGE = 40;
  const state = { region: "전체", limit: PAGE };
  let DATA = { updated: null, items: [] };
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
    return e;
  }
  const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "#";
  const parts = (t) => { const d = new Date(t + KST); return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes() }; };
  const dayKey = (t) => Math.floor((t + KST) / DAY);

  function flag() {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("aria-hidden", "true");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M8 1.5 15 14H1L8 1.5Zm-.75 4.5v4h1.5V6h-1.5Zm0 5v1.5h1.5V11h-1.5Z");
    s.append(p); return s;
  }
  function dayLabel(k) {
    const today = dayKey(Date.now());
    if (k === today) return "오늘";
    if (k === today - 1) return "어제";
    const p = parts(k * DAY - KST + 1); return `${p.mo}월 ${p.d}일`;
  }

  function render() {
    const items = DATA.items
      .filter((i) => state.region === "전체" || i.regions.includes(state.region))
      .sort((a, b) => Date.parse(b.dt) - Date.parse(a.dt));
    const box = $("list"); box.replaceChildren(); $("more").replaceChildren();
    document.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.r === state.region)));
    if (!items.length) {
      box.append(el("div", { class: "empty", text: DATA.updated ? "표시할 기사가 없습니다." : "아직 수집된 기사가 없습니다. 평일·주말 09:00~18:00에 15분마다 업데이트됩니다." }));
      return;
    }
    let curKey = null, ul = null;
    items.slice(0, state.limit).forEach((i) => {
      const t = Date.parse(i.dt), k = dayKey(t);
      if (k !== curKey) { curKey = k; box.append(el("h2", { class: "day", text: dayLabel(k) })); ul = el("ul", { class: "news" }); box.append(ul); }
      const p = parts(t);
      const meta = el("div", { class: "meta" });
      if (i.important) meta.append(el("span", { class: "flag" }, flag(), "주요"));
      meta.append(el("span", { text: `${pad(p.h)}:${pad(p.mi)}` }), el("span", { text: i.regions.join("·") }), el("span", { text: i.categories.join("·") }));
      ul.append(el("li", { class: i.important ? "imp" : "" },
        el("div", { class: "body" }, el("div", { class: "title", text: i.title }), meta),
        el("a", { class: "go", href: safeUrl(i.link), target: "_blank", rel: "noopener noreferrer", "aria-label": i.title + " 원문보기", text: "원문보기" })));
    });
    if (items.length > state.limit) {
      const b = el("button", { class: "ghost", type: "button", text: `더 보기 (${items.length - state.limit}건)` });
      b.addEventListener("click", () => { state.limit += PAGE; render(); });
      $("more").append(b);
    }
  }

  function setUpdated() {
    if (!DATA.updated) { $("upd").textContent = "수집 대기 중"; return; }
    const t = Date.parse(DATA.updated), p = parts(t), min = Math.max(0, Math.round((Date.now() - t) / 60000));
    $("upd").textContent = `${pad(p.mo)}/${pad(p.d)} ${pad(p.h)}:${pad(p.mi)} 업데이트 (${min < 1 ? "방금" : min < 60 ? min + "분 전" : Math.floor(min / 60) + "시간 전"})`;
  }
  async function load() {
    const w = document.querySelector(".wrap"); w.classList.add("busy");
    try {
      const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      DATA = await res.json(); $("err").style.display = "none";
    } catch (e) {
      $("err").style.display = "block"; $("err").textContent = "데이터를 불러오지 못했습니다 (" + e.message + "). 잠시 후 다시 확인해 주세요.";
    }
    w.classList.remove("busy"); setUpdated(); render();
  }

  document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { state.region = b.dataset.r; state.limit = PAGE; render(); }));
  setInterval(load, 5 * 60 * 1000);
  setInterval(setUpdated, 30 * 1000);

  const MODES = ["auto", "light", "dark"], LABEL = { auto: "자동", light: "라이트", dark: "다크" };
  let mode = "auto"; try { mode = localStorage.getItem("news-theme") || "auto"; } catch (e) {}
  if (!MODES.includes(mode)) mode = "auto";
  function applyMode() {
    if (mode === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", mode);
    $("theme").textContent = "화면: " + LABEL[mode];
  }
  $("theme").addEventListener("click", () => { mode = MODES[(MODES.indexOf(mode) + 1) % 3]; try { localStorage.setItem("news-theme", mode); } catch (e) {} applyMode(); });
  applyMode();
  load();
})();
</script>
</body>
</html>
