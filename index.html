<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부산·울산·경남 기상·재해 뉴스</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --line: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,.10);
    --wash: rgba(11,11,11,.05);
    --accent: #2a78d6;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
      --line: #2c2c2a; --axis: #4a4a46; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
      --accent: #6da7ec; --critical: #ec6a6a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
    --line: #2c2c2a; --axis: #4a4a46; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
    --accent: #6da7ec; --critical: #ec6a6a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 14px 16px 48px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; margin-bottom: 4px; color: var(--ink-2); font-size: 13px; }
  .top .left { font-weight: 600; }
  .top .right { display: flex; align-items: center; gap: 10px; }
  .ghost { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
  .ghost:hover { background: var(--wash); }

  h2.day { margin: 26px 0 4px; font-size: 14px; font-weight: 700; color: var(--ink-2); letter-spacing: .02em; }
  ol.feed { list-style: none; margin: 0; padding: 0; }

  /* 기사: 주요(큰 제목·붉은 줄) / 일반(한 단계 작은 제목·회색 줄) */
  ol.feed li { padding: 18px 0 18px 20px; border-bottom: 1px solid var(--line); box-shadow: inset 6px 0 0 var(--axis); }
  ol.feed li.imp { padding: 22px 0 22px 20px; box-shadow: inset 6px 0 0 var(--critical); }
  .title { margin: 0; font-weight: 700; letter-spacing: -.02em; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; font-size: clamp(22px, 3.6vw, 34px); }
  li.imp .title { font-weight: 800; line-height: 1.25; font-size: clamp(30px, 5.2vw, 58px); }
  .row { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 15px; color: var(--ink-2); }
  li.imp .row { margin-top: 10px; }
  .row .when { font-variant-numeric: tabular-nums; }
  .flag { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--ink); }
  .flag svg { width: 14px; height: 14px; }
  .flag path { fill: var(--critical); }
  a.go { color: var(--accent); font-weight: 650; text-decoration: none; border-bottom: 2px solid currentColor; }
  a.go:hover { opacity: .8; }

  .empty { text-align: center; color: var(--ink-2); padding: 80px 8px; font-size: clamp(22px, 4vw, 34px); font-weight: 650; }
  .more { text-align: center; margin-top: 22px; }
  .more .ghost { font-size: 15px; padding: 8px 18px; }
  .err { color: var(--critical); padding: 10px 0; }
  .busy { opacity: .6; transition: opacity .15s; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 650; box-shadow: 0 6px 24px rgba(0,0,0,.25); display: none; z-index: 10; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="left" id="count"></span>
    <div class="right">
      <span id="upd" aria-live="polite">불러오는 중…</span>
      <button class="ghost" type="button" id="theme" aria-label="화면 모드 변경">화면: 자동</button>
    </div>
  </div>
  <div id="err" class="err" style="display:none"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <main id="list" aria-label="기상·재해 뉴스"></main>
  <div class="more" id="more"></div>
</div>

<script>
(function () {
  "use strict";
  const KST = 9 * 3600e3, DAY = 86400e3, PAGE = 30;
  let DATA = { updated: null, items: [] }, limit = PAGE;
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
    return e;
  }
  const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : "#";
  const parts = (t) => { const d = new Date(t + KST); return { mo: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes() }; };
  const dayKey = (t) => Math.floor((t + KST) / DAY);
  const dayLabel = (k) => {
    const today = dayKey(Date.now());
    if (k === today) return "오늘";
    if (k === today - 1) return "어제";
    const p = parts(k * DAY - KST + 1);
    return `${p.mo}월 ${p.d}일`;
  };
  function flag() {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("aria-hidden", "true");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M8 1.5 15 14H1L8 1.5Zm-.75 4.5v4h1.5V6h-1.5Zm0 5v1.5h1.5V11h-1.5Z");
    s.append(p); return s;
  }

  function render() {
    const items = DATA.items.slice().sort((a, b) => Date.parse(b.dt) - Date.parse(a.dt));
    const box = $("list"); box.replaceChildren(); $("more").replaceChildren();
    const imp = items.filter((i) => i.important).length;
    $("count").textContent = items.length ? `총 ${items.length}건 · 주요 ${imp}건` : "";
    if (!items.length) {
      box.append(el("div", { class: "empty", text: DATA.updated ? "표시할 기사가 없습니다" : "수집 대기 중입니다" }));
      return;
    }
    let curKey = null, ol = null;
    items.slice(0, limit).forEach((i) => {
      const t = Date.parse(i.dt), k = dayKey(t);
      if (k !== curKey) { curKey = k; box.append(el("h2", { class: "day", text: dayLabel(k) })); ol = el("ol", { class: "feed" }); box.append(ol); }
      const p = parts(t), row = el("div", { class: "row" });
      if (i.important) row.append(el("span", { class: "flag" }, flag(), "주요"));
      row.append(
        el("span", { class: "when", text: `${pad(p.h)}:${pad(p.mi)}` }),
        el("span", { text: i.regions.join("·") }),
        el("span", { text: i.categories.join("·") }),
        el("a", { class: "go", href: safeUrl(i.link), target: "_blank", rel: "noopener noreferrer", "aria-label": i.title + " 원문보기", text: "원문보기" }));
      ol.append(el("li", { class: i.important ? "imp" : "" }, el("h3", { class: "title", text: i.title }), row));
    });
    if (items.length > limit) {
      const b = el("button", { class: "ghost", type: "button", text: `이전 기사 더 보기 (${items.length - limit}건)` });
      b.addEventListener("click", () => { limit += PAGE; render(); });
      $("more").append(b);
    }
  }

  let lastCheck = 0, lastLoad = 0, firstLoadDone = false, toastTimer = null;
  const checked = () => { if (!lastCheck) return ""; const q = parts(lastCheck); return ` · 확인 ${pad(q.h)}:${pad(q.mi)}`; };
  function notify(n) {
    const t = $("toast"); t.textContent = `새 기사 ${n}건 반영됨 (눌러서 닫기)`; t.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, 15000);
    t.onclick = () => { t.style.display = "none"; };
  }
  function setUpdated() {
    if (!DATA.updated) { $("upd").textContent = "새 기사 대기 중" + checked(); return; }
    const t = Date.parse(DATA.updated), p = parts(t), min = Math.max(0, Math.round((Date.now() - t) / 60000));
    $("upd").textContent = `새 기사 반영 ${pad(p.mo)}/${pad(p.d)} ${pad(p.h)}:${pad(p.mi)} (${min < 1 ? "방금" : min < 60 ? min + "분 전" : min < 1440 ? Math.floor(min / 60) + "시간 전" : Math.floor(min / 1440) + "일 전"})` + checked();
  }
  async function load() {
    const w = document.querySelector(".wrap"); w.classList.add("busy");
    try {
      const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const next = await res.json(); $("err").style.display = "none";
      if (firstLoadDone) {
        const known = new Set(DATA.items.map((i) => i.link));
        const added = next.items.filter((i) => !known.has(i.link)).length;
        if (added > 0) notify(added);
      }
      DATA = next; firstLoadDone = true; lastCheck = Date.now();
    } catch (e) {
      $("err").style.display = "block";
      $("err").textContent = location.protocol === "file:"
        ? "파일을 직접 열면 데이터를 읽을 수 없습니다. 웹 주소(https://…github.io/busan-weather-news/)로 접속해 주세요."
        : "데이터를 불러오지 못했습니다 (" + e.message + "). 인터넷 연결, 광고 차단·보안 프로그램, 사내망 차단 여부를 확인해 주세요.";
    }
    lastLoad = Date.now(); w.classList.remove("busy"); setUpdated(); render();
  }
  setInterval(load, 60 * 1000);
  setInterval(setUpdated, 30 * 1000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - lastLoad > 60 * 1000) load();
  });

  const MODES = ["auto", "light", "dark"], LABEL = { auto: "자동", light: "라이트", dark: "다크" };
  let mode = "auto"; try { mode = localStorage.getItem("news-theme") || "auto"; } catch (e) {}
  if (!MODES.includes(mode)) mode = "auto";
  function applyMode() {
    if (mode === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", mode);
    $("theme").textContent = "화면: " + LABEL[mode];
  }
  $("theme").addEventListener("click", () => { mode = MODES[(MODES.indexOf(mode) + 1) % 3]; try { localStorage.setItem("news-theme", mode); } catch (e) {} applyMode(); });
  applyMode();
  load();
})();
</script>
</body>
</html>
